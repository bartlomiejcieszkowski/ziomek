<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ziomek Avatar</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    #status {
      color: #666;
      font-size: 12px;
      font-family: monospace;
    }
    #name {
      color: #eee;
      font-size: 14px;
    }
    #status_text, #system_text, #on_hold, #events {
      color: #999;
      font-size: 12px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div id="container">
    <canvas id="avatar" width="100" height="100"></canvas>
    <div id="name"></div>
    <div id="status_text"></div>
    <div id="system_text"></div>
    <div id="on_hold"></div>
    <div id="events"></div>
    <div id="status">Loading...</div>
  </div>

  <script>
    const canvas = document.getElementById('avatar');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;  // pixels do not blur, which is how the format reads scaling
    const statusEl = document.getElementById('status');
    const nameEl = document.getElementById('name');
    const statusTextEl = document.getElementById('status_text');
    const systemTextEl = document.getElementById('system_text');
    const onHoldEl = document.getElementById('on_hold');
    const eventsEl = document.getElementById('events');

    let skinName = '';
    const images = {};  // picture per name: the sheet for a cell, one picture for each file

    // The mapping the skin answered with: expression name to the frames it shows, in order
    let mapping = {};
    let fallbackEntry = null;

    // Current animation state
    let currentExpression = '';
    let currentCycleIndex = -1;
    let animFrameIndex = 0;
    let animTimer = null;
    const DEFAULT_INTERVAL = 200; // ms per frame for a skin that declares none

    /** The scale that places one frame inside the box, which is what a fit says in numbers */
    function fitScale(fit, frameWidth, frameHeight, boxWidth, boxHeight) {
      const byWidth = boxWidth / frameWidth;
      const byHeight = boxHeight / frameHeight;
      if (fit === 'fill') return [byWidth, byHeight];
      if (fit === 'cover') {
        const scale = Math.max(byWidth, byHeight);
        return [scale, scale];
      }
      if (fit === 'none') return [1, 1];
      if (fit === 'scale-down') {
        const scale = Math.min(1, Math.min(byWidth, byHeight));
        return [scale, scale];
      }
      const scale = Math.min(byWidth, byHeight);
      return [scale, scale];
    }

    /** Keep one picture under its name and draw again once it is readable */
    function keepImage(key, dataUrl, onRead) {
      const image = new Image();
      image.onload = () => {
        images[key] = image;
        onRead();
      };
      // The server returns the data URL already prefixed, so use it directly
      image.src = dataUrl;
    }

    function imageFor(frame, redraw) {
      const key = frame.kind === 'cell' ? skinName : skinName + '/' + frame.file;
      if (images[key]) return images[key];
      const url =
        frame.kind === 'cell'
          ? '/api/avatar/sprite?skin=' + encodeURIComponent(skinName)
          : '/api/avatar/image?skin=' + encodeURIComponent(skinName) + '&file=' + encodeURIComponent(frame.file);
      fetch(url)
        .then((response) => (response.ok ? response.json() : null))
        .then((data) => {
          if (!data) return;
          keepImage(key, data.sprite_b64 || data.image_b64, redraw);
        });
      return null;
    }

    let heldSeconds = 0;
    let onHold = false;

    /** Count up a hold that the page started counting from */
    function formatDuration(seconds) {
      const mm = String(Math.floor(seconds / 60)).padStart(2, '0');
      const ss = String(seconds % 60).padStart(2, '0');
      return `${mm}:${ss}`;
    }

    /** Render the name and the two text areas from a state message */
    function renderAreas(msg) {
      nameEl.textContent = msg.name ?? '';
      statusTextEl.textContent = msg.status_text ?? '';
      systemTextEl.textContent = msg.system_text ?? '';
      onHold = !!msg.on_hold;
      heldSeconds = msg.held_seconds ?? 0;
      renderEvents(msg.events);
      renderHold();
    }

    /** The events of this call, in the order they happened */
    function renderEvents(events) {
      eventsEl.textContent = (events ?? []).map((e) => `${e.name} ${e.action}`).join('\n');
    }

    /** The hold duration counts up on the client, not only in the message */
    function renderHold() {
      onHoldEl.textContent = onHold ? `On hold ${formatDuration(heldSeconds)}` : '';
    }

    /** Draw current frame for the given expression and cycle index */
    function drawFrame(expression, cycleIndex) {
      // The frames this expression shows come from the mapping the skin answered with; a name the
      // definition does not cover reaches what it falls back to.
      const entry = mapping[expression] || fallbackEntry;
      if (!entry || !entry.frames.length) {
        statusEl.textContent = `${expression} has no frame to draw`;
        return;
      }
      // A list that loops returns to its first entry, one that does not stops at its last.
      const count = entry.frames.length;
      const frame = entry.loop ? entry.frames[cycleIndex % count] : entry.frames[Math.min(cycleIndex, count - 1)];
      const picture = imageFor(frame, () => drawFrame(expression, cycleIndex));
      if (!picture) return;  // drawn again once the picture can be read

      // The box is this page, since the size of the box is not part of a definition.
      const [scaleWidth, scaleHeight] = fitScale(frame.fit, frame.width, frame.height, canvas.width, canvas.height);
      const drawnWidth = frame.width * scaleWidth;
      const drawnHeight = frame.height * scaleHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      // What is shown when a frame is larger than the box is decided by its centre, since the format has no position field.
      ctx.drawImage(
        picture,
        (frame.column || 0) * frame.width, (frame.row || 0) * frame.height,  // source X, Y
        frame.width, frame.height,                                           // source W, H
        (canvas.width - drawnWidth) / 2, (canvas.height - drawnHeight) / 2,  // dest X, Y
        drawnWidth, drawnHeight                                              // dest W, H
      );

      statusEl.textContent = `${expression} ${cycleIndex}`;
      currentExpression = expression;
      currentCycleIndex = cycleIndex;
    }

    /** Start animation timer for cycle progression */
    function startAnimation() {
      if (animTimer) clearInterval(animTimer);
      animFrameIndex = 0;

      const step = () => {
        const expr = currentExpression;
        const entry = mapping[expr] || fallbackEntry;
        if (!entry || !entry.frames.length) return;  // nothing to advance over
        const count = entry.frames.length;
        const cycle = currentCycleIndex >= 0 ? currentCycleIndex : animFrameIndex % count;
        drawFrame(expr, cycle);
        animFrameIndex++;
        if (!entry.loop && animFrameIndex >= count) clearInterval(animTimer);  // a list that does not loop stops
      };
      const delay = (mapping[currentExpression] && mapping[currentExpression].interval_ms) || DEFAULT_INTERVAL;
      animTimer = setInterval(step, delay);
    }

    /** Try to load sprite from an external URL (JSON API) */
    function fetchSpriteFromUrl(url) {
      return fetch(url)
        .then(res => {
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.json();
        })
        .then(data => {
          // One source for the mapping: the sizes and the frames come from what the skin declared.
          mapping = data.expressions || {};
          fallbackEntry = data.fallback || null;
          skinName = data.skin;
          // A definition of type image states no size, so the box of this page stays as the page sets it.
          if (data.frameWidth && data.frameHeight) {
            canvas.width = data.frameWidth;
            canvas.height = data.frameHeight;
          }
          if (data.sprite_b64) {
            keepImage(skinName, data.sprite_b64, () => drawFrame(currentExpression, currentCycleIndex));
          }
        })
        .catch(err => {
          statusEl.textContent = 'Sprite load error: ' + err.message;
          console.error('[ziomek] Sprite load error:', err);
        });
    }

    /** Connect to the avatar state WebSocket (relative so it works on any host/port) */
    function connectStateWebSocket() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${protocol}//${location.host}/api/avatar/ws`);

      ws.onopen = () => {
        statusEl.textContent = 'Connected';
      };

      ws.onmessage = (event) => {
        let msg;
        try {
          msg = JSON.parse(event.data);
        } catch (err) {
          console.error('[ziomek] Bad WebSocket message:', event.data);
          return;
        }

        if (msg && msg.type === 'state') {
          renderAreas(msg);
          drawFrame(msg.expression, msg.cycleIndex);
        }
      };

      ws.onclose = () => {
        statusEl.textContent = 'Disconnected';
      };

      ws.onerror = (err) => {
        console.error('[ziomek] WebSocket error:', err);
      };
    }

    /** Count up a held participant between messages */
    function startHoldTicker() {
      setInterval(() => {
        if (onHold) {
          heldSeconds += 1;
          renderHold();
        }
      }, 1000);
    }

    /** Initialize — load sprite, connect, start animation */
    function init() {
      fetchSpriteFromUrl('/api/avatar/sprite')
        .then(() => {
          connectStateWebSocket();
          startAnimation();
          startHoldTicker();
        });
    }

    init();
  </script>
</body>
</html>
