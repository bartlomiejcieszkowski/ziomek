<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ziomek roster</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/static/roster.css"></head>
<body>
    <div id="layout">
      <div id="main">
        <div id="count"></div>
        <div id="roster"></div>
      </div>
      <div id="panel">
        <div id="header">
          <button id="toggle">hide</button>
          <button id="state_text">show text</button>
          <button id="save">Save</button>
          <button id="formats">▼</button>
          <div id="menu">
            <button data-format="markdown">Markdown</button>
            <button data-format="json">JSON</button>
          </div>
        </div>
        <ul id="transcript"></ul>
      </div>
    </div>


    <script type="module">import { start } from "/static/roster.mjs"; start("__TRANSCRIPT_DEFAULT__");</script>
</body>
</html>
