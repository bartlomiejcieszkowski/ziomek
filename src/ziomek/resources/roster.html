<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ziomek roster</title>
    <style>
      body { font-family: sans-serif; background: #111; color: #eee; }
      #layout { display: flex; gap: 12px; }
      #roster { flex: 0 0 55% }
      #panel { flex: 1; border-left: 1px solid #444; padding-left: 12px; }
      #layout.hide #roster { flex: 1 1 auto }
      #layout.hide #transcript { display: none; }
      #transcript li { white-space: pre-wrap; }
      #menu { display: none; }
      #menu.open { display: block; }
      @media (max-width: 900px) {
        #layout { display: block; }
        #roster, #panel { flex: none; }
      }
      .tile { padding: 12px; margin: 8px 0; background: #1b1b22; border-radius: 6px; }
      .tile .name { font-weight: bold; margin-bottom: 4px; }
      .status_text, .system_text, .on_hold { white-space: pre-wrap; font-size: 13px; }
      .on_hold { color: #8ab4f8; }
      .expression { color: #d2a9ff; font-size: 13px; }
      ul.events { margin: 6px 0 0; padding-left: 18px; font-size: 12px; color: #999; }
    </style>
  </head>
  <body>
    <div id="layout">
      <div id="roster"></div>
      <div id="panel">
        <div id="header">
          <button id="toggle">hide</button>
          <button id="save">Save</button>
          <button id="formats">(...)</button>
          <div id="menu">
            <button data-format="markdown">Markdown</button>
            <button data-format="json">JSON</button>
          </div>
        </div>
        <ul id="transcript"></ul>
      </div>
    </div>

    <script>
      const initial = "__TRANSCRIPT_DEFAULT__";

      let lastEntries = [];
      let rendered = 0;

      const PAST = { "join": "joined", "hold": "is on hold", "leave": "left" };
      const EXT = { markdown: "md", json: "json" };

      function formatLine(entry) {
        if (!entry.text && !entry.name && !entry.action) return "";
        const parts = [entry.name, entry.author, entry.text];
        const head = parts.slice(0, 2).filter(Boolean);
        return entry.text ? (head.length ? head.join(" ") + " — " + entry.text : entry.text) : (entry.name ? entry.name + " " + PAST[entry.action] + "." : entry.action + ".");
      }

      function renderLine(entry) {
        const line = formatLine(entry);
        if (!line) return;
        const item = document.createElement("li");
        item.textContent = line;
        document.getElementById("transcript").appendChild(item);
      }

      function render(tiles) {
        const root = document.getElementById("roster");
        root.innerHTML = "";
        for (const tile of tiles) {
          const el = document.createElement("div");
          el.className = "tile";
          renderText(el, "name", tile.name);
          renderText(el, "status_text", tile.status_text);
          renderText(el, "system_text", tile.system_text);
          renderText(el, "expression", tile.expression);
          renderText(el, "on_hold", tile.state === "held" ? "On hold " + held(tile) : "");
          const list = document.createElement("ul");
          list.className = "events";
          for (const event of tile.events || []) {
            const item = document.createElement("li");
            const line = event.name + " " + event.action;
            const author = event.author ? " (" + event.author + ")" : "";
            item.textContent = line + (event.text ? author + ": " + event.text : "");
            list.appendChild(item);
          }
          if (list.children.length) el.appendChild(list);
          root.appendChild(el);
        }
      }

      function held(tile) {
        const seconds = tile.held_seconds || 0;
        return String(Math.floor(seconds / 60)).padStart(2, "0") + ":" + String(seconds % 60).padStart(2, "0");
      }

      function renderText(root, className, value) {
        const el = document.createElement("div");
        el.className = className;
        el.textContent = value || "";
        root.appendChild(el);
      }

      function pad(n) {
        return String(n).padStart(2, "0");
      }

      function buildFilename(ext) {
        const now = new Date();
        const date = [now.getFullYear(), pad(now.getMonth() + 1), pad(now.getDate())].join("-");
        return "ziomek_" + date + "_" + pad(now.getHours()) + pad(now.getMinutes()) + "_transcript." + ext;
      }

      function markdownFile(entries) {
        return new Blob(["# Transcript\n" + entries.map(formatLine).filter(Boolean).join("\n")], { type: "text/plain" });
      }

      function jsonFile(entries) {
        return new Blob([JSON.stringify(entries)], { type: "application/json" });
      }

      function download(content, name) {
        const link = document.createElement("a");
        link.href = URL.createObjectURL(content);
        link.download = name;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(link.href);
      }

      function readCookieState() {
        const match = document.cookie.match(/(?:^|;\s*)ziomek_panel=([^;]*)/);
        if (!match) return null;
        try {
          const value = decodeURIComponent(match[1]);
          return value === "open" || value === "closed" ? value : null;
        } catch (error) {
          return null;  // URIError from a malformed escape, so the config default decides
        }
      }

      function setPanelState(state) {
        document.cookie = "ziomek_panel=" + encodeURIComponent(state) + "; path=/";
      }

      function panelOpen() {
        const stored = readCookieState();
        if (!stored) return initial === "open";
        return stored === "open";
      }

      function setShown(shown) {
        document.getElementById("layout").classList.toggle("hide", !shown);
        const label = document.getElementById("toggle");
        label.textContent = shown ? "hide" : "show";
      }

      document.getElementById("toggle").addEventListener("click", () => {
        const shown = !document.getElementById("layout").classList.contains("hide");
        setShown(!shown);
        setPanelState(shown ? "open" : "closed");
      });

      document.getElementById("formats").addEventListener("click", () => {
        document.getElementById("menu").classList.toggle("open");
      });

      document.getElementById("save").addEventListener("click", () => {
        download(markdownFile(lastEntries), buildFilename(EXT.markdown));
      });

      document.getElementById("menu").addEventListener("click", (event) => {
        const ext = event.target.dataset.format;
        if (!ext) return;
        download(ext === "json" ? jsonFile(lastEntries) : markdownFile(lastEntries), buildFilename(EXT[ext] || ext));
      });

      async function refresh() {
        try {
          const response = await fetch("/api/roster");
          render(await response.json());
          const stream = await fetch("/api/roster/transcript");
          lastEntries = await stream.json();
        } catch (error) {
          return;  // a failed poll keeps the record as it was, so nothing is shown from it
        }

        if (lastEntries.length < rendered) {
          // The record shrank, which means a new call: the panel starts from nothing.
          document.getElementById("transcript").innerHTML = "";
          rendered = 0;
        }
        for (const entry of lastEntries.slice(rendered)) {
          renderLine(entry);
        }
        rendered = lastEntries.length;
      }

      setShown(panelOpen());
      refresh();
      setInterval(refresh, 1000);
    </script>
  </body>
</html>
