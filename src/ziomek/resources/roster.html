<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ziomek roster</title>
    <style>
      body { font-family: sans-serif; background: #111; color: #eee; }
      .tile { padding: 12px; margin: 8px 0; background: #1b1b22; border-radius: 6px; }
      .tile .name { font-weight: bold; margin-bottom: 4px; }
      .status_text, .system_text, .on_hold { white-space: pre-wrap; font-size: 13px; }
      .on_hold { color: #8ab4f8; }
      .expression { color: #d2a9ff; font-size: 13px; }
      ul.events { margin: 6px 0 0; padding-left: 18px; font-size: 12px; color: #999; }
    </style>
  </head>
  <body>
    <div id="roster"></div>
    <script>
      function render(tiles) {
        const root = document.getElementById("roster");
        root.innerHTML = "";
        for (const tile of tiles) {
          const el = document.createElement("div");
          el.className = "tile";
          renderText(el, "name", tile.name);
          renderText(el, "status_text", tile.status_text);
          renderText(el, "system_text", tile.system_text);
          renderText(el, "expression", tile.expression);
          renderText(el, "on_hold", tile.state === "held" ? "On hold " + held(tile) : "");
          const list = document.createElement("ul");
          list.className = "events";
          for (const event of tile.events || []) {
            const item = document.createElement("li");
            const line = event.name + " " + event.action;
            const author = event.author ? " (" + event.author + ")" : "";
            item.textContent = line + (event.text ? author + ": " + event.text : "");
            list.appendChild(item);
          }
          el.appendChild(list);
          root.appendChild(el);
        }
      }

      function renderText(root, className, value) {
        const el = document.createElement("div");
        el.className = className;
        el.textContent = value || "";
        root.appendChild(el);
      }

      function held(tile) {
        const seconds = tile.held_seconds || 0;
        return String(Math.floor(seconds / 60)).padStart(2, "0") + ":" + String(seconds % 60).padStart(2, "0");
      }

      async function refresh() {
        const response = await fetch("/api/roster");
        render(await response.json());
      }

      refresh();
      setInterval(refresh, 1000);
    </script>
  </body>
</html>
