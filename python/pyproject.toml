[project]
name = "ziomek"
version = "0.1.0"
description = "Humanize AI backend — TTS + avatar display server"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pocket-tts>=3.0", "torch>=2.0", "numpy>=1.24", "scipy>=1.10",
    "sounddevice>=0.4", "soundfile>=0.12", "safetensors>=0.4",
    "fastapi>=0.100", "uvicorn[standard]>=0.23", "pydantic>=2.0",
    "pillow>=10.0", "requests>=2.31",
    "pygame-ce>=2.5.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "httpx2>=2.0", "ruff>=0.1"]

[project.scripts]
ziomek = "ziomek.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ziomek"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["I"]

[tool.pytest.ini_options]
log_cli = true
log_level = "NOTSET"