[project]
name = "ziomek"
description = "ziomek - Humanize AI"
dynamic = ["version"]
author = [
    {name = "Bartlomiej Cieszkowski", email = "bartlomiej.cieszkowski@gmail.com"}
]
requires-python = ">=3.10"
keywords = ["llm", "ai", "agent", "skill"]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "pocket-tts>=3.0", "torch>=2.0", "numpy>=1.24", "scipy>=1.10",
    "sounddevice>=0.4", "soundfile>=0.12", "safetensors>=0.4",
    "fastapi>=0.100", "uvicorn[standard]>=0.23", "pydantic>=2.0",
    "pillow>=10.0", "requests>=2.31",
    "pygame-ce>=2.5.8",
]

[project.urls]
"Homepage" = "https://github.com/bartlomiejcieszkowski/ziomek"
"Bug Tracker" = "https://github.com/bartlomiejcieszkowski/ziomek/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "httpx2>=2.0", "ruff>=0.1"]

[project.scripts]
ziomek = "ziomek.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
only-packages = true

[tool.hatch.build.targets.wheel]
packages = ["src/ziomek"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["I"]

[tool.hatch.version]
path = "src/ziomek/__init__.py"

[tool.pytest.ini_options]
log_cli = true
log_level = "NOTSET"